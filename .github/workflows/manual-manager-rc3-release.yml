name: Release / V0.5.6 RC3 manager (one-time manual)
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Enter PUBLISH_0.5.6_RC3 to release both verified manager packages'
        type: string
        required: true

# This is NOT the automatic AX6S stable-release gate. No push/PR/schedule trigger.
# One-time, manually authorized RC publication from a pinned, successful main CI.
permissions:
  contents: read

concurrency:
  group: component-updater-manager-0.5.6-rc3-manual
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
      SOURCE_SHA: 8981a7f8e08b3f788080b36a716a27ec08052b46
      SOURCE_RUN_ID: '44897597757'
      ARTIFACT_ID: '14704935350'
      ARTIFACT_DIGEST: 'sha256:d0e90078c11675b486ac7fd3c9c6dfb892dadb98d0430d03aca0326ca25e4f38'
      TAG: luci-app-component-updater-v0.5.6-rc3
      IPK: luci-app-component-updater_0.5.6-3_all.ipk
      APK: luci-app-component-updater-0.5.6-r3.apk
    steps:
      - name: Verify explicit release authorization and pinned successful main run
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_RELEASE" = 'PUBLISH_0.5.6_RC3' || {
            echo "::error::Explicit RC3 authorization text is required."
            exit 1
          }
          run_info="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")"
          printf '%s' "$run_info" | jq -e --arg sha "$SOURCE_SHA" '
            .head_sha == $sha and
            .head_branch == "main" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            .name == "Component Updater / CI & native IPK/APK"
          ' >/dev/null
          artifact_info="$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID")"
          printf '%s' "$artifact_info" | jq -e --arg digest "$ARTIFACT_DIGEST" --argjson run "$SOURCE_RUN_ID" '
            .name == "luci-app-component-updater-ipk" and
            (.expired | not) and
            .digest == $digest and
            .workflow_run.id == $run
          ' >/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists: $TAG; immutable assets will not be replaced."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $TAG; refusing to retarget."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: 8981a7f8e08b3f788080b36a716a27ec08052b46
          persist-credentials: false

      - name: Confirm package versions and recheck source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -qx 'PKG_VERSION:=0.5.6' luci-app-component-updater/Makefile
          grep -qx 'PKG_RELEASE:=3' luci-app-component-updater/Makefile
          grep -Fqx 'VERSION = "0.5.6-3"' <(grep '^VERSION =' tools/package_ipk.py)
          python3 tools/check_docs.py
          python3 -m unittest discover -s tests -p test_release_contract.py -v

      - name: Download exactly the two artifacts from the pinned passing CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" --name 'luci-app-component-updater-ipk' --dir dist
          test -s "dist/$IPK"
          test -s "dist/$APK"
          count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = 2 || {
            echo "::error::Unexpected files in manager CI artifact ($count instead of 2)."
            find dist -maxdepth 1 -type f
            exit 1
          }
          (cd dist && sha256sum "$IPK" "$APK" > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import io, pathlib, tarfile
          path=pathlib.Path('dist/luci-app-component-updater_0.5.6-3_all.ipk')
          with tarfile.open(path,mode='r:gz') as tar:
              control=tar.extractfile('./control.tar.gz').read()
          with tarfile.open(fileobj=io.BytesIO(control),mode='r:gz') as tar:
              body=tar.extractfile('./control').read().decode()
          assert 'Package: luci-app-component-updater\n' in body
          assert 'Version: 0.5.6-3\n' in body
          assert 'Architecture: all\n' in body
          print('Native IPK control identity verified')
          PY

      - name: Publish immutable RC3 Release with honest scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/component-updater-rc3-notes.md <<'NOTES'
          ## LuCI Component Updater V0.5.6 RC3 (IPK + APK)
          
          This is an officially published **pre-release**, not a fully certified stable release. Both manager packages come from the same successful main-branch CI run (44897597757, source commit 8981a7f8e08b3f788080b36a716a27ec08052b46) and are accompanied by SHA256SUMS.txt.
          
          **Verified on physical AX6S / APKv3:** manager web self-update 0.5.6-r3 → test-only r4 → r3 rollback; NaiveProxy native APK update 154.0.8037.49.5-r1 → r3 and rollback to r1. The binary hash, original configuration and /etc/apk/world were checked before, after and on rollback.
          
          **Verified in CI for IPK / opkg:** native OpenWrt 21.02.5 and 24.10.5 rootfs installation/recovery, Python/JS/Shell, package and ARM64 checks. Complete live-IPK update/rollback on GL-MT3600BE and N1 has not yet been evidenced.
          
          **Not validated on physical hardware:** live PassWall/NaiveProxy process traffic, interruption/power-loss recovery, and other APK firmware variants. AX6S did not have PassWall running during the component test. The known stale check_state=ready after completion/rollback is cosmetic; ready=false and the actual version remain authoritative.
          
          This project does **not** provide independent package signatures. Verify SHA256SUMS.txt, confirm the package-manager format, and keep a recovery path. The normal automatic-publish safety gate remains disabled; this release is a separately authorized one-time manual publication.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1 ||
             gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag or release appeared while checking; do not overwrite."
            exit 1
          fi
          gh release create "$TAG" "dist/$IPK" "dist/$APK" dist/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title 'LuCI Component Updater V0.5.6 RC3' \
            --latest=false --prerelease --notes-file /tmp/component-updater-rc3-notes.md
          gh api "repos/$GH_REPO/releases/tags/$TAG" |
            jq -e --arg ipk "$IPK" --arg apk "$APK" '
              .prerelease == true and .draft == false and
              ([.assets[].name] | sort) == ([$ipk, $apk, "SHA256SUMS.txt"] | sort)
            '
          echo "::notice::RC3 published; auto-publish gate remains unchanged."
