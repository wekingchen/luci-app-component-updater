name: Component Builder / Official Releases & UPX
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: Component ID (or all enabled components)
        type: string
        default: all
      publish:
        description: Publish successfully validated artifacts into immutable Releases
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: component-release
  cancel-in-progress: false
jobs:
  discover-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish each enabled component independently
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component || 'all' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          set -euo pipefail
          mapfile -t COMPONENTS < <(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import component_builder as b
          print('\n'.join(cfg['id'] for cfg in b.definitions(os.environ['COMPONENT'])))
          PY
          )
          if [[ "${#COMPONENTS[@]}" -eq 0 ]]; then
            echo 'No enabled components'; exit 1
          fi
          for COMPONENT_ID in "${COMPONENTS[@]}"; do
            echo "::group::${COMPONENT_ID}"
            export COMPONENT_ID
            TAG=$(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import component_builder as b
          cfg=b.definitions(os.environ['COMPONENT_ID'])[0]
          release=b.github_json('https://api.github.com/repos/'+cfg['upstream']['repository']+'/releases/latest', os.environ.get('GITHUB_TOKEN',''))
          print(b.release_tag(cfg,release['tag_name']))
          PY
            )
            echo "Component release: $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Already published; skip: $TAG"
              echo '::endgroup::'
              continue
            fi
            OUT="dist/$COMPONENT_ID"
            python3 tools/component_builder.py --component "$COMPONENT_ID" --output "$OUT"
            [[ "$(cat "$OUT/release-tag.txt")" == "$TAG" ]] || { echo 'Release changed during build'; exit 1; }
            if [[ "$PUBLISH" == 'true' ]]; then
              gh release create "$TAG" "$OUT"/*.tar.xz "$OUT/manifest.json" \
                --title "$TAG" --latest=false \
                --notes "Repackaged official binaries. The manifest records upstream digests, compression, and basic tests. Device-runtime compatibility and package-manager metadata are NOT guaranteed."
            fi
            echo '::endgroup::'
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: component-build-artifacts
          path: |
            dist/*/*.tar.xz
            dist/*/manifest.json
          if-no-files-found: ignore
