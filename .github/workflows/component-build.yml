name: Component Builder / Official Releases & UPX
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      component:
        description: Component ID
        type: choice
        options: [naiveproxy]
        default: naiveproxy
      publish:
        description: Publish validated artifacts into a GitHub Release
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: component-release
  cancel-in-progress: false
jobs:
  discover-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check supported upstream versions and pick release tag
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          python3 tools/component_builder.py --component "$COMPONENT" --dry-run --output dist
          TAG=$(python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0,'tools')
          import component_builder as b
          items=b.definitions(os.environ['COMPONENT'])
          if len(items)!=1:
              raise SystemExit('V1 publishing supports exactly one enabled component')
          cfg=items[0]
          latest=b.github_json('https://api.github.com/repos/'+cfg['upstream']['repository']+'/releases/latest',os.environ['GITHUB_TOKEN'])
          print(b.release_tag(cfg,latest['tag_name']))
          PY
          )
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; no rebuild needed"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build official assets using pinned UPX
        if: steps.plan.outputs.exists != 'true'
        env:
          COMPONENT: ${{ inputs.component || 'all' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/component_builder.py --component "$COMPONENT" --output dist
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.exists != 'true'
        with:
          name: component-build-${{ steps.plan.outputs.tag }}
          path: |
            dist/*.tar.xz
            dist/manifest.json
          if-no-files-found: error
      - name: Publish immutable component release
        if: steps.plan.outputs.exists != 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.xz dist/manifest.json \
            --title "$TAG" \
            --notes "Repacked official upstream release with UPX 5.2.1 --lzma --best. Hashes and source provenance in manifest.json. Functional tests on each target device are still required." \
            --latest=false
