name: Component Builder / Official Releases & UPX
on:
  schedule:
    # Prebuild in the cloud every 20 min (GitHub schedule may be delayed).
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      component:
        description: Component ID (or all enabled components)
        type: string
        default: all
      publish:
        description: Publish successfully validated artifacts into immutable Releases
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: component-release
  cancel-in-progress: false
jobs:
  discover-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenWrt usign from pinned source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/openwrt/usign.git /tmp/component-usign
          git -C /tmp/component-usign checkout --quiet c4c72b1b07945ee192361dc751291a7c98d6adcd
          cmake -S /tmp/component-usign -B /tmp/component-usign/build -DUSE_LIBUBOX=OFF
          cmake --build /tmp/component-usign/build -j2
          sudo install -m755 /tmp/component-usign/build/usign /usr/local/bin/usign
      - name: Build and publish each enabled component independently
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ inputs.component || 'all' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          SIGNING_KEY_B64: ${{ secrets.COMPONENT_USIGN_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == 'true' && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Only the default main branch may publish signed releases'
            exit 1
          fi
          mapfile -t COMPONENTS < <(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import component_builder as b
          print('\n'.join(cfg['id'] for cfg in b.definitions(os.environ['COMPONENT'])))
          PY
          )
          if [[ "${#COMPONENTS[@]}" -eq 0 ]]; then
            echo 'No enabled components'; exit 1
          fi
          for COMPONENT_ID in "${COMPONENTS[@]}"; do
            echo "::group::${COMPONENT_ID}"
            export COMPONENT_ID
            TAG=$(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import component_builder as b
          cfg=b.definitions(os.environ['COMPONENT_ID'])[0]
          release=b.github_json('https://api.github.com/repos/'+cfg['upstream']['repository']+'/releases/latest', os.environ.get('GITHUB_TOKEN',''))
          print(b.release_tag(cfg,release['tag_name']))
          PY
            )
            echo "Component release: $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fxq 'manifest.json.sig'; then
                echo "::error::Release $TAG is unsigned. Do not reuse it: increment component revision and publish a new tag."
                exit 1
              fi
              echo "Signed release already published; skip: $TAG"
              echo '::endgroup::'
              continue
            fi
            OUT="dist/$COMPONENT_ID"
            python3 tools/component_builder.py --component "$COMPONENT_ID" --output "$OUT"
            [[ "$(cat "$OUT/release-tag.txt")" == "$TAG" ]] || { echo 'Release changed during build'; exit 1; }
            python3 tools/validate_artifacts.py --manifest "$OUT/manifest.json"
            if [[ "$PUBLISH" == 'true' ]]; then
              PUBKEY="luci-app-component-updater/root/usr/share/component-updater/trust.pub"
              if [[ -z "$SIGNING_KEY_B64" || ! -s "$PUBKEY" ]]; then
                echo '::error::Missing COMPONENT_USIGN_PRIVATE_KEY_B64 secret or trusted public key. Refusing unsigned publish.'
                exit 1
              fi
              umask 077
              KEY_FILE=$(mktemp)
              trap 'rm -f "$KEY_FILE"' EXIT
              printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KEY_FILE"
              usign -S -m "$OUT/manifest.json" -s "$KEY_FILE" -x "$OUT/manifest.json.sig"
              usign -V -q -m "$OUT/manifest.json" -p "$PUBKEY" -x "$OUT/manifest.json.sig"
              rm -f "$KEY_FILE"
              trap - EXIT
              gh release create "$TAG" "$OUT"/*.tar.xz "$OUT/manifest.json" "$OUT/manifest.json.sig" \
                --title "$TAG" --latest=false --prerelease \
                --notes "Signed pre-release candidate. SHA256/provenance/UPX round-trip verified, signed manifest with pinned usign key. Router functional verification still required."
            fi
            echo '::endgroup::'
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: component-build-artifacts
          path: |
            dist/*/*.tar.xz
            dist/*/manifest.json
            dist/*/manifest.json.sig
          if-no-files-found: ignore
