name: Component Updater / CI & native IPK/APK
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check built-in GitHub runner tools
        run: |
          command -v shellcheck
          command -v jq
          command -v busybox
          shellcheck --version | head -n 2
          jq --version
          busybox | head -n 1
      - name: Validate component definitions and tests
        run: |
          python3 tools/check_docs.py
          python3 -m unittest discover -s tests -v
          COMPONENT_TEST_SHELL=busybox python3 -m unittest discover -s tests -p test_device_integration.py -k test_native_install_then_rollback -v
          python3 -m py_compile tools/component_builder.py tools/package_ipk.py tools/validate_artifacts.py
          python3 -m json.tool components/naiveproxy.json >/dev/null
          python3 -m json.tool luci-app-component-updater/root/usr/share/luci/menu.d/luci-app-component-updater.json >/dev/null
          python3 -m json.tool luci-app-component-updater/root/usr/share/rpcd/acl.d/luci-app-component-updater.json >/dev/null
      - name: Check backend scripts and LuCI JavaScript syntax
        run: |
          sh -n luci-app-component-updater/root/usr/sbin/component-updaterctl
          sh -n luci-app-component-updater/root/usr/libexec/rpcd/component-updater
          sh -n luci-app-component-updater/root/usr/libexec/component-updater/ax6s-apkctl.sh
          sh -n scripts/device-readonly-acceptance.sh scripts/device-live-acceptance.sh
          shellcheck -S warning luci-app-component-updater/root/usr/sbin/component-updaterctl luci-app-component-updater/root/usr/libexec/rpcd/component-updater
          for path in luci-app-component-updater/htdocs/luci-static/resources/view/component-updater/*.js; do
            JS_FILE="$path" node -e "const fs=require('fs');new Function(fs.readFileSync(process.env.JS_FILE,'utf8'));console.log(process.env.JS_FILE,'LuCI JS parse OK')"
          done
          node tests/luci_ui_smoke.js
      - name: Install CJK fonts for Chinese browser screenshot acceptance
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
            fc-cache -f
          fi
      - name: Render mobile / desktop preview and audit computed LuCI styles
        run: sh scripts/render_ui_previews.sh
      - uses: actions/upload-artifact@v4
        with:
          name: luci-ui-visual-v0.5.4
          path: ui-review/*.png
          if-no-files-found: error
      - name: Check AX6S native APK build scripts
        run: |
          sh -n tools/package_manager_apk.sh
          sh -n scripts/device-ax6s-apk-preflight.sh
          sh -n luci-app-component-updater/root/usr/libexec/component-updater/device-ax6s-apk-preflight.sh
      - name: Build installable opkg IPK
        run: python3 tools/package_ipk.py --out dist
      - name: Build and inspect genuine APKv3 with pinned non-minimal apk-tools
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:edge sh -ec '
            set -eu
            apk add --no-cache build-base git meson ninja pkgconf openssl-dev zlib-dev linux-headers
            git clone --depth=1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git /tmp/apk-src
            test "$(git -C /tmp/apk-src rev-parse HEAD)" = 522171e05c72c8a0dd2a9392f053c89196fbdb9b
            meson setup /tmp/apk-build /tmp/apk-src \
              -Dminimal=false -Dhelp=disabled -Ddocs=disabled -Dlua=disabled \
              -Dpython=disabled -Dtests=disabled -Dzstd=disabled -Durl_backend=wget
            ninja -C /tmp/apk-build
            APK_TOOL=/tmp/apk-build/src/apk sh tools/package_manager_apk.sh dist
            /tmp/apk-build/src/apk adbdump --format json \
              dist/luci-app-component-updater-0.5.4-r1.apk > dist/manager-apk-adbdump.json
            grep -q "luci-app-component-updater" dist/manager-apk-adbdump.json
          '
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-component-updater-ipk
          path: |
            dist/*.ipk
            dist/*.apk
          if-no-files-found: error

  publish-luci-candidate:
    name: Publish verified LuCI manager pre-release
    needs: test-and-package
    # Further releases require AX6S real hardware acceptance.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.AX6S_APK_AUTO_PUBLISH == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luci-app-component-updater-ipk
          path: dist
      - name: Publish immutable tested manager IPK as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=luci-app-component-updater-v0.5.4-rc1
          test -s dist/luci-app-component-updater_0.5.4-1_all.ipk
          pkg=luci-app-component-updater_0.5.4-1_all.ipk
          manager_apk=luci-app-component-updater-0.5.4-r1.apk
          test -s "dist/$manager_apk"
          (cd dist && sha256sum "$pkg" "$manager_apk" > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Published IPK is immutable. Compare logical tar members instead
            # of compressed bytes: older gzip headers contained timestamps.
            previous="$(mktemp -d)"
            trap 'rm -rf "$previous"' EXIT
            gh release download "$tag" --pattern "$pkg" --pattern "$manager_apk" --pattern SHA256SUMS.txt --dir "$previous"
            python3 tools/compare_ipk_payloads.py "dist/$pkg" "$previous/$pkg" "$previous/SHA256SUMS.txt"
            (cd "$previous" && sha256sum -c SHA256SUMS.txt)
            cmp "dist/$manager_apk" "$previous/$manager_apk"
            echo "::notice::Published release has identical package contents; skip republishing."
            exit 0
          fi
          gh release create "$tag" dist/luci-app-component-updater_0.5.4-1_all.ipk dist/luci-app-component-updater-0.5.4-r1.apk dist/SHA256SUMS.txt \
            --title "Component Updater V0.5.4 RC1" --latest=false --prerelease \
            --notes "Native APKv3 updater candidate: extracted AX6S firmware tests verify SHA256-gated install, previous-package backup, configuration retention, full native APK rollback. Existing opkg behavior unchanged. Physical AX6S device and live PassWall traffic validation remain outstanding."
