name: Component Updater / CI & IPK
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install static checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq busybox
      - name: Validate component definitions and tests
        run: |
          python3 -m unittest discover -s tests -v
          COMPONENT_TEST_SHELL=busybox python3 -m unittest discover -s tests -p test_device_integration.py -k test_native_install_then_rollback -v
          python3 -m py_compile tools/component_builder.py tools/package_ipk.py tools/validate_artifacts.py
          python3 -m json.tool components/naiveproxy.json >/dev/null
          python3 -m json.tool luci-app-component-updater/root/usr/share/luci/menu.d/luci-app-component-updater.json >/dev/null
          python3 -m json.tool luci-app-component-updater/root/usr/share/rpcd/acl.d/luci-app-component-updater.json >/dev/null
      - name: Check backend scripts and LuCI JavaScript syntax
        run: |
          sh -n luci-app-component-updater/root/usr/sbin/component-updaterctl
          sh -n luci-app-component-updater/root/usr/libexec/rpcd/component-updater
          sh -n scripts/device-readonly-acceptance.sh scripts/device-live-acceptance.sh
          shellcheck -S warning luci-app-component-updater/root/usr/sbin/component-updaterctl luci-app-component-updater/root/usr/libexec/rpcd/component-updater
          for path in luci-app-component-updater/htdocs/luci-static/resources/view/component-updater/*.js; do
            JS_FILE="$path" node -e "const fs=require('fs');new Function(fs.readFileSync(process.env.JS_FILE,'utf8'));console.log(process.env.JS_FILE,'LuCI JS parse OK')"
          done
          node tests/luci_ui_smoke.js
      - name: Build installable IPK
        run: python3 tools/package_ipk.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-component-updater-ipk
          path: dist/*.ipk
          if-no-files-found: error
